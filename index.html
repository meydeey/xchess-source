<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>XChess</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141416" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="XChess" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <svg class="app-icon-library" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="app-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 20.5v-6h6v6"/></symbol>
      <symbol id="app-library" viewBox="0 0 24 24"><path d="M3.5 4.5h5A3.5 3.5 0 0 1 12 8a3.5 3.5 0 0 1 3.5-3.5h5v14h-4.75A4.5 4.5 0 0 0 12 20a4.5 4.5 0 0 0-3.75-1.5H3.5zM12 8v12M6.5 9.5h3m4 0h3"/></symbol>
      <symbol id="app-exercises" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></symbol>
      <symbol id="app-challenges" viewBox="0 0 24 24"><path d="m12 2.8 8.2 4.6v9.2L12 21.2l-8.2-4.6V7.4zM8.6 12l2.2 2.2 4.6-4.6"/></symbol>
      <symbol id="app-progress" viewBox="0 0 24 24"><path d="M4 19.5h16M6 16.5v-4m4 4v-6m4 6V8m4 8.5V5"/></symbol>
      <symbol id="app-settings" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2.25"/><circle cx="9" cy="17" r="2.25"/></symbol>
      <symbol id="app-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.4a2.35 2.35 0 0 1 4.6.55c0 1.55-2.3 1.95-2.3 3.8m0 2.85v.1"/></symbol>
      <symbol id="app-sound" viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4zM15.5 9a4.3 4.3 0 0 1 0 6m2.8-8.3a7.5 7.5 0 0 1 0 10.6"/></symbol>
      <symbol id="app-muted" viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4zm12 1 4 4m0-4-4 4"/></symbol>
      <symbol id="app-music" viewBox="0 0 24 24"><path d="M9 17V6l11-2v11M9 9l11-2"/><ellipse cx="6" cy="17.5" rx="3" ry="2.5"/><ellipse cx="17" cy="15.5" rx="3" ry="2.5"/></symbol>
      <symbol id="app-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    </svg>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="#/" aria-label="XChess">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text"><strong class="brand-name">XChess</strong><small id="brand-signature">Un coup d’avance</small></span>
        </a>
        <nav id="nav" aria-label="Navigation principale">
          <a data-route="today" href="#/"><svg class="nav-icon" aria-hidden="true"><use href="#app-home"/></svg><span>Accueil</span></a>
          <a data-route="library" href="#/library"><svg class="nav-icon" aria-hidden="true"><use href="#app-library"/></svg><span>Ouvertures</span></a>
          <a data-route="exercises" href="#/exercises"><svg class="nav-icon" aria-hidden="true"><use href="#app-exercises"/></svg><span>Exercices</span></a>
          <a data-route="challenges" href="#/progress/path"><svg class="nav-icon" aria-hidden="true"><use href="#app-challenges"/></svg><span>Défis</span></a>
          <a data-route="progress" href="#/progress"><svg class="nav-icon" aria-hidden="true"><use href="#app-progress"/></svg><span>Progrès</span></a>
        </nav>
        <div class="rail-links">
          <a data-route="settings" href="#/settings"><svg class="nav-icon" aria-hidden="true"><use href="#app-settings"/></svg><span>Réglages</span></a>
          <a data-route="help" href="#/settings/help"><svg class="nav-icon" aria-hidden="true"><use href="#app-help"/></svg><span>Aide</span></a>
        </div>
      </header>
      <div class="app-work">
        <header class="app-topbar">
          <a class="brand mobile-brand" href="#/" aria-label="XChess"><span class="brand-mark" aria-hidden="true"></span><strong class="brand-name">XChess</strong></a>
          <div class="app-context" id="app-context"></div>
          <div class="app-tools">
            <a id="player-chip" class="player-chip" href="#/progress/trophies"></a>
            <button id="music-toggle" class="music-toggle app-control" type="button" aria-label="Musique" aria-pressed="false"><svg class="nav-icon" aria-hidden="true"><use href="#app-music"/></svg></button>
            <button id="effects-toggle" class="app-control" type="button" aria-label="Bruitages" aria-pressed="true"><svg class="nav-icon" aria-hidden="true"><use href="#app-sound"/></svg></button>
            <a id="nav-settings" class="app-control" data-route="settings" href="#/settings" aria-label="Réglages"><svg class="nav-icon" aria-hidden="true"><use href="#app-settings"/></svg></a>
          </div>
        </header>
        <main id="view" class="view"></main>
      </div>
    </div>
    <div id="save-banner" class="save-banner" role="alert" hidden>
      <span>Sauvegarde impossible : ta progression est gardée en mémoire, nouvelle tentative automatique.</span>
      <button type="button">Réessayer</button>
    </div>
    <div id="game-toasts" class="game-toasts" aria-live="polite"></div>
    <div id="levelup" class="levelup" role="dialog" aria-modal="true" aria-labelledby="levelup-level" hidden>
      <div class="levelup-card">
        <div class="confetti" aria-hidden="true"></div>
        <p class="eyebrow">Niveau supérieur</p>
        <p class="levelup-level" id="levelup-level"></p>
        <p class="levelup-title"></p>
        <p class="levelup-next"></p>
        <button type="button" class="levelup-close">Continuer</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden>
      <span class="toast-text"></span>
      <button type="button" class="toast-action link" hidden></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
