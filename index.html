<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>XChess</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101b1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="XChess" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">XChess</span>
        </a>
        <a id="player-chip" class="player-chip" href="#/progress/trophies"></a>
        <nav id="nav" aria-label="Navigation principale">
          <a data-route="today" href="#/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c.5 2.8 2 4.3 3.4 5.8 1.5 1.6 2.8 3.2 2.8 5.6a6.2 6.2 0 0 1-12.4 0c0-2 .9-3.5 2.1-4.7.2 1.4.8 2.5 1.9 3C9.1 10.3 10.4 6.4 12 3.5z"/></svg><span class="nav-full">Aujourd'hui</span><span class="nav-short">Aujourd'hui</span></a>
          <a data-route="library" href="#/library"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg><span class="nav-full">Ouvertures</span><span class="nav-short">Ouvertures</span></a>
          <a data-route="exercises" href="#/exercises"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M7 7l3 3-4 4M17 7l-3 3 4 4M7 19h10M9 14h6v5H9z"/></svg><span class="nav-full">Exercices</span><span class="nav-short">Exercices</span></a>
          <a data-route="progress" href="#/progress"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1.5A3.5 3.5 0 0 0 8.5 11M16 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8.5 20.5h7M10 17h4v3.5h-4z"/></svg><span class="nav-full">Progrès</span><span class="nav-short">Progrès</span></a>
          <a data-route="settings" href="#/settings"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="nav-full">Réglages</span><span class="nav-short">Réglages</span></a>
        </nav>
      </header>
      <div id="view" class="view"></div>
    </div>
    <div id="save-banner" class="save-banner" role="alert" hidden>
      <span>Sauvegarde impossible : ta progression est gardée en mémoire, nouvelle tentative automatique.</span>
      <button type="button">Réessayer</button>
    </div>
    <div id="game-toasts" class="game-toasts" aria-live="polite"></div>
    <div id="levelup" class="levelup" role="dialog" aria-modal="true" aria-labelledby="levelup-level" hidden>
      <div class="levelup-card">
        <div class="confetti" aria-hidden="true"></div>
        <p class="eyebrow">Niveau supérieur</p>
        <p class="levelup-level" id="levelup-level"></p>
        <p class="levelup-title"></p>
        <p class="levelup-next"></p>
        <button type="button" class="levelup-close">Continuer</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden>
      <span class="toast-text"></span>
      <button type="button" class="toast-action link" hidden></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
